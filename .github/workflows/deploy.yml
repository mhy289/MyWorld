name: Build & Deploy to Tencent Server

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 前端：构建 dist/ 并部署 ----------
  deploy-frontend:
    name: Deploy Frontend (Vue)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Tencent Server
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          SOURCE: "dist/"
          TARGET: ${{ secrets.DEPLOY_DIR }}
          EXCLUDE: ".git*"

  # ---------- 后端：交叉编译 Go 二进制并部署重启 ----------
  deploy-backend:
    name: Deploy Backend (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build backend binary (linux/amd64)
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o myworld-backend .
          cd ..
          mkdir -p backend-dist
          cp backend/myworld-backend backend-dist/

      - name: Upload backend binary
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          SOURCE: "backend-dist/"
          TARGET: ${{ secrets.BACKEND_DIR }}

      - name: Restart backend service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            pkill -f myworld-backend || true
            cd ${{ secrets.BACKEND_DIR }}
            chmod +x myworld-backend
            nohup ./myworld-backend > server.log 2>&1 &
